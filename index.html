// 渲染逻辑
// ============================================================
let currentFilter = 'all';
let searchQuery = '';
let favorites = JSON.parse(localStorage.getItem('ielts_favorites')) || {};
let theme = localStorage.getItem('ielts_theme') || 'light';
let showTranslation = localStorage.getItem('ielts_translation') === 'true' ? true : false;

function render() {
  const container = document.getElementById('storiesContainer');
  container.innerHTML = '';
  let totalTopics = 0, shownTopics = 0;
  storiesData.forEach(story => {
    let filteredTopics = story.topics.filter(t => {
      const matchTag = currentFilter === 'all' || t.tag === currentFilter;
      const matchSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          t.answer.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          story.title.toLowerCase().includes(searchQuery.toLowerCase());
      return matchTag && matchSearch;
    });
    if (filteredTopics.length === 0) return;
    shownTopics += filteredTopics.length;
    totalTopics += story.topics.length;
    const group = document.createElement('div');
    group.className = 'story-group';
    group.id = story.id;
    group.innerHTML = `<div class="story-title-main">${story.title}</div>`;
    filteredTopics.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = t.id;
      const isFav = favorites[t.id] || false;
      const transClass = showTranslation ? 'show' : '';
      card.innerHTML = `
        <div class="card-header">
          <span class="topic-name">${t.title}</span>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="tag">${t.tag}</span>
            <div class="card-actions">
              <button class="fav-btn" data-id="${t.id}" style="color:${isFav ? '#f5a623' : 'inherit'}; opacity:${isFav ? 1 : 0.6};">⭐</button>
              <button class="copy-btn" data-answer="${encodeURIComponent(t.answer.replace(/<[^>]*>/g,'').trim())}">📋</button>
            </div>
          </div>
        </div>
        <div class="answer">${t.answer}</div>
        ${t.translation ? `<div class="translation ${transClass}"><span class="label">🇨🇳 中文翻译：</span>${t.translation}</div>` : ''}
        ${t.reuse ? `<div class="reuse"><strong>♻️ 复用</strong> ${t.reuse.map(r => `<span>${r}</span>`).join(' ')}</div>` : ''}
      `;
      group.appendChild(card);
    });
    container.appendChild(group);
  });
  const progressPct = totalTopics > 0 ? Math.round((shownTopics / totalTopics) * 100) : 0;
  document.getElementById('progressInfo').textContent = `进度: ${progressPct}% (${shownTopics}/${totalTopics})`;
  buildSidebar();
  attachCardEvents();
  const savedScroll = localStorage.getItem('ielts_scroll');
  if (savedScroll) {
    document.getElementById('mainContent').scrollTop = parseInt(savedScroll);
  }
}

function buildSidebar() {
  const list = document.getElementById('storyList');
  list.innerHTML = '';
  storiesData.forEach(story => {
    const item = document.createElement('div');
    item.className = 'story-item';
    const titleDiv = document.createElement('div');
    titleDiv.className = 'story-title';
    const count = story.topics.length;
    titleDiv.innerHTML = `<span>${story.title}</span><span class="badge">${count}</span>`;
    titleDiv.onclick = () => {
      const list = titleDiv.nextElementSibling;
      list.classList.toggle('open');
    };
    item.appendChild(titleDiv);
    const topicList = document.createElement('div');
    topicList.className = 'topic-list';
    story.topics.forEach(t => {
      const link = document.createElement('a');
      link.className = 'topic-link';
      link.textContent = t.title;
      const tagLabel = document.createElement('span');
      tagLabel.className = 'tag-label';
      tagLabel.textContent = t.tag;
      link.appendChild(tagLabel);
      link.onclick = (e) => {
        e.preventDefault();
        const target = document.getElementById(t.id);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (window.innerWidth <= 768) {
          document.getElementById('sidebar').style.display = 'none';
        }
      };
      topicList.appendChild(link);
    });
    item.appendChild(topicList);
    list.appendChild(item);
  });
  const first = list.querySelector('.topic-list');
  if (first) first.classList.add('open');
}

function attachCardEvents() {
  document.querySelectorAll('.fav-btn').forEach(btn => {
    btn.onclick = function() {
      const id = this.dataset.id;
      favorites[id] = !favorites[id];
      localStorage.setItem('ielts_favorites', JSON.stringify(favorites));
      render();
    };
  });
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = function() {
      const text = decodeURIComponent(this.dataset.answer);
      navigator.clipboard.writeText(text).then(() => {
        const orig = this.textContent;
        this.textContent = '✅';
        setTimeout(() => this.textContent = orig, 1500);
      }).catch(() => alert('复制失败，请手动复制'));
    };
  });
}

// ========== 搜索 & 筛选 ==========
document.getElementById('searchBox').addEventListener('input', function() {
  searchQuery = this.value;
  render();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    render();
  };
});

// ========== 主题切换 ==========
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('ielts_theme', t);
}
document.getElementById('themeToggle').onclick = function() {
  const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(newTheme);
};
applyTheme(theme);

// ========== 翻译切换 ==========
function applyTranslation(show) {
  showTranslation = show;
  localStorage.setItem('ielts_translation', show ? 'true' : 'false');
  document.getElementById('transToggle').textContent = show ? '🌐 中文' : '🌐 英文';
  document.getElementById('transToggle').classList.toggle('active', show);
  render();
}
document.getElementById('transToggle').onclick = function() {
  applyTranslation(!showTranslation);
};
applyTranslation(showTranslation);

// ========== 侧边栏切换 ==========
document.getElementById('toggleSidebar').onclick = function() {
  const sidebar = document.getElementById('sidebar');
  sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
};

// ========== 滚动顶部 ==========
const scrollBtn = document.getElementById('scrollTopBtn');
document.getElementById('mainContent').addEventListener('scroll', function() {
  if (this.scrollTop > 300) {
    scrollBtn.classList.add('show');
  } else {
    scrollBtn.classList.remove('show');
  }
  localStorage.setItem('ielts_scroll', this.scrollTop);
});
scrollBtn.onclick = function() {
  document.getElementById('mainContent').scrollTo({ top: 0, behavior: 'smooth' });
};

// ========== 导出功能 ==========
function exportWord(storyId) {
  let exportHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>雅思口语串题宝典</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; max-width: 1100px; margin:0 auto; }
    .story-group { margin-bottom: 30px; border:1px solid #ccc; padding:16px 20px; background:#fafcff; border-radius:8px; }
    .story-title-main { font-size: 24px; font-weight: 700; border-left: 6px solid #4a8bf5; padding-left: 16px; margin-bottom: 20px; }
    .card { border-left: 4px solid #4a8bf5; padding: 12px 18px; margin-bottom: 14px; background: #fff; border-radius:6px; }
    .card-header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
    .topic-name { font-size: 18px; font-weight: 700; }
    .tag { font-size: 12px; background: #e3edfd; padding: 0 12px; border-radius: 30px; display:inline-block; }
    .answer { font-size: 15px; line-height: 1.7; }
    .common { background: #fff8e1; padding: 2px 6px; border-radius: 4px; border-bottom: 2px solid #f5c542; }
    .translation { display: block; background: #f0f8ff; padding: 8px 12px; border-radius: 6px; margin-top: 8px; }
    .reuse { font-size: 13px; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 8px; }
    .reuse span { background: #f0f5fe; padding: 2px 8px; border-radius: 16px; margin: 0 3px 3px 0; display: inline-block; }
    .highlight-phrase { background: #fff3cd; padding: 0 4px; border-radius: 4px; }
  </style>
  </head><body>`;
  storiesData.forEach(story => {
    if (storyId !== 'all' && story.id !== storyId) return;
    exportHtml += `<div class="story-group"><div class="story-title-main">${story.title}</div>`;
    story.topics.forEach(t => {
      exportHtml += `
        <div class="card">
          <div class="card-header">
            <span class="topic-name">${t.title}</span>
            <span class="tag">${t.tag}</span>
          </div>
          <div class="answer">${t.answer}</div>
          ${t.translation ? `<div class="translation"><span class="label">🇨🇳 中文翻译：</span>${t.translation}</div>` : ''}
          ${t.reuse ? `<div class="reuse"><strong>♻️ 复用</strong> ${t.reuse.map(r => `<span>${r}</span>`).join(' ')}</div>` : ''}
        </div>
      `;
    });
    exportHtml += `</div>`;
  });
  exportHtml += `</body></html>`;
  const blob = new Blob([exportHtml], { type: 'application/msword;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = storyId === 'all' ? '雅思口语串题宝典_全部.doc' : `雅思口语_${storyId}.doc`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(link.href);
}

document.getElementById('exportAllWord').onclick = function() {
  exportWord('all');
};
document.getElementById('exportCurrentStoryWord').onclick = function() {
  const visible = document.querySelector('.story-group');
  if (visible) {
    exportWord(visible.id);
  } else {
    alert('没有可见的故事');
  }
};

document.getElementById('exportPDF').onclick = function() {
  window.print();
};

// ========== 初始化 ==========
render();
</script>
